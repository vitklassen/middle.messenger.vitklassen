<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Web messenger</title>
    <link rel="stylesheet" href="src/styles/page-profile.scss">
  </head>
  <body>
    <main class="content content_type_profile"> 
      <div class="back-button-container">
        <button class="back-button" ></button>
      </div>
      <div class="profile">
        <button class="profile__avatar-button">
          <span class="profile__avatar-tooltip">Поменять аватар</span>
          <img src="image/profile__avatar-button-image.svg" alt="Картинка" class="profile__avatar-image">
        </button>
        <h2 class="profile__name profile__name_type_change">Виктор</h2>
        <form class="profile-form" id="profile-form"> 
          <fieldset class="profile-form__fieldset" form="profile-form"> 
            <label class="profile-form__label" for="old_password">Старый пароль</label>
            <input id="old_password" name="old_password" type="password" class="profile-form__input" value="qwerty" disabled>
          </fieldset>
          <fieldset class="profile-form__fieldset" form="profile-form">
            <label class="profile-form__label" for="new_password">Новый пароль</label>
            <input id="new_password" name="new_password" type="password" class="profile-form__input">
          </fieldset>
          <fieldset class="profile-form__fieldset" form="profile-form">
            <label class="profile-form__label" for="new_password">Повторите новый пароль</label>
            <input id="new_password" name="new_password" type="password" class="profile-form__input">
          </fieldset>
          {{>SubmitButton buttonClassName="submit-button submit-button_type_change-password" buttonText="Сохранить"}}
        </form>
      </div>
    </main>
  </body>
</html>
