<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Web messenger</title>
    <link rel="stylesheet" href="src/styles/page-profile.scss">
  </head>
  <body>
    <main class="content content_type_profile"> 
      <div class="back-button-container">
        <button class="back-button" ></button>
      </div>
      <div class="profile">
        <button class="profile__avatar-button">
          <span class="profile__avatar-tooltip">Поменять аватар</span>
          <img src="image/profile__avatar-button-image.svg" alt="Картинка" class="profile__avatar-image">
        </button>
        <h2 class="profile__name">Виктор</h2>
        <form class="profile-form" id="profile-form"> 
          <fieldset class="profile-form__fieldset" form="profile-form"> 
            <label class="profile-form__label" for="email">Почта</label>
            <input id="email" name="email" type="email" class="profile-form__input" disabled placeholder="pochta@yandex.ru">
          </fieldset>
          <fieldset class="profile-form__fieldset" form="profile-form">
            <label class="profile-form__label" for="login">Логин</label>
            <input id="login" name="login" type="text" class="profile-form__input" disabled placeholder="vitklassen">
          </fieldset>
          <fieldset class="profile-form__fieldset" form="profile-form">
            <label class="profile-form__label" for="first_name">Имя</label>
            <input id="first_name" name="first_name" type="text" class="profile-form__input" disabled placeholder="Виктор">
          </fieldset>
          <fieldset class="profile-form__fieldset" form="profile-form">
            <label class="profile-form__label" for="second_name">Фамилия</label>
            <input id="second_name" name="second_name" type="text" class="profile-form__input" disabled placeholder="Классен"> 
          </fieldset>
          <fieldset class="profile-form__fieldset" form="profile-form">
            <label class="profile-form__label" for="display_name">Имя в чате</label>
            <input id="display_name" name="display_name" type="text" class="profile-form__input" disabled placeholder="Виктор">
          </fieldset>
          <fieldset class="profile-form__fieldset" form="profile-form">
            <label class="profile-form__label" for="email">Телефон</label>
            <input id="phone" name="phone" type="tel" class="profile-form__input" disabled placeholder="8 (800) 555 35 35">
          </fieldset>
        </form>
        <footer class="profile__footer">
          <button class="profile__footer-button">Изменить данные</button>
          <button class="profile__footer-button">Изменить пароль</button>
          <button class="profile__footer-button">Выйти</button>
        </footer>
      </div>
    </main>
  </body>
</html>
