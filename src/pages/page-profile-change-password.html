<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web messenger</title>
    <link rel="stylesheet" href="styles/page-profile.scss">
  </head>
  <body>
    <main class="content content_type_profile"> 
      <div class="back-button-container">
        <button class="back-button" ></button>
      </div>
      <div class="profile">
        <form class="profile-form" id="profile-form"> 
          <div class="profile-form__avatar-wrapper">
            <input name="avatar" type="file" id="avatar" class="profile-form__avatar-input">
            <img src="../../image/profile__avatar-button-image.svg" class="profile-form__avatar-image">
            <label for="avatar" class="profile-form__avatar-label">
               <span class="profile-form__avatar-span">Поменять аватар</span>
            </label>
         </div>
          <h2 class="profile__name">Виктор</h2>
          <fieldset class="profile-form__fieldset" form="profile-form"> 
            <label class="profile-form__label" for="oldPassword">Старый пароль</label>
            <input id="oldPassword" name="oldPassword" type="password" class="profile-form__input" value="qwerty" disabled>
          </fieldset>
          <fieldset class="profile-form__fieldset" form="profile-form">
            <label class="profile-form__label" for="newPassword">Новый пароль</label>
            <input id="newPassword" name="newPassword" type="password" class="profile-form__input">
          </fieldset>
          <fieldset class="profile-form__fieldset" form="profile-form">
            <label class="profile-form__label" for="newPassword">Повторите новый пароль</label>
            <input id="newPassword" name="newPassword" type="password" class="profile-form__input">
          </fieldset>
          {{>SubmitButton buttonClassName="submit-button submit-button_type_change-password" buttonText="Сохранить"}}
        </form>
      </div>
    </main>
  </body>
</html>
